
[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "RUF",
]

ignore = [
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["UP007", "E501"]
